<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2E1EE0" />
    <link rel="icon" type="image/png" href="/images/color-logo.png" />
    <link rel="apple-touch-icon" href="/images/color-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <title>Semicon Labs — Learn Semiconductor Engineering by Solving Real Project Problems</title>
    <meta
      name="description"
      content="Semicon Labs is an execution-first semiconductor learning platform. Solve real engineering challenges in Physical Design and Design Verification — investigate, fix, and validate, just like on the job."
    />
    <!-- Static social-preview tags. React overwrites these per route via
         <Seo>, but link crawlers (WhatsApp, LinkedIn, Twitter) do not run
         JavaScript, so the shared card comes from right here. -->
    <link rel="canonical" href="https://semiconlabs.com/" data-rh="true" />
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:site_name" content="Semicon Labs" data-rh="true" />
    <meta property="og:title" content="Semicon Labs — The world&#39;s first VLSI cloud labs" data-rh="true" />
    <meta property="og:description" content="Solve real chip problems on industry EDA tools — Cadence, Synopsys and Siemens — in Physical Design and Design Verification, and get placement-ready." data-rh="true" />
    <meta property="og:url" content="https://semiconlabs.com/" data-rh="true" />
    <meta property="og:image" content="https://semiconlabs.com/images/og-card.png" data-rh="true" />
    <meta property="og:image:width" content="1200" data-rh="true" />
    <meta property="og:image:height" content="630" data-rh="true" />
    <meta property="og:locale" content="en_US" data-rh="true" />
    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta name="twitter:site" content="@semiconlabs" data-rh="true" />
    <meta name="twitter:title" content="Semicon Labs — The world&#39;s first VLSI cloud labs" data-rh="true" />
    <meta name="twitter:description" content="Solve real chip problems on industry EDA tools in Physical Design and Design Verification, and get placement-ready." data-rh="true" />
    <meta name="twitter:image" content="https://semiconlabs.com/images/og-card.png" data-rh="true" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
